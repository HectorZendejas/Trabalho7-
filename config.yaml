# Configuração de exemplo para o simulador de busca P2P
# 12 nós, cada um com pelo menos 2 e no máximo 4 vizinhos

num_nodes: 12
min_neighbors: 2
max_neighbors: 4

# Recursos distribuídos pelos nós
resources:
  n1: r1, r2, r3
  n2: r4, r5
  n3: r6, r7
  n4: r8, r9
  n5: r10, r1
  n6: r2, r11
  n7: r12, r3
  n8: r4, r13
  n9: r5, r14
  n10: r6, r15
  n11: r7, r8
  n12: r9, r10

# Arestas (não direcionadas) — cada nó tem entre 2 e 4 vizinhos
edges:
  - n1, n2
  - n1, n3
  - n1, n4
  - n2, n5
  - n2, n6
  - n3, n7
  - n3, n8
  - n4, n9
  - n4, n10
  - n5, n11
  - n6, n11
  - n7, n12
  - n8, n12
  - n9, n10
  - n10, n11
  - n11, n12
